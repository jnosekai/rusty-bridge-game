<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusty Bridge Game</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#game {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

/* フィールド */
#world {
  position: absolute;
  left: 0;
  top: 0;
  height: 900%;
}

#map {
  height: 100%;
  width: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* ボート */
#boat {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  transform: translate(-50%, -50%) rotate(180deg);
  transform-origin: center;
  z-index: 20;
  pointer-events: none;
}

/* 操作 */
#controls {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 150px;
  height: 150px;
  z-index: 40;
}

.control {
  position: absolute;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  font-size: 24px;
  font-weight: bold;
  touch-action: none;
}

#up {
  left: 50px;
  top: 0;
}

#down {
  left: 50px;
  bottom: 0;
}

#left {
  left: 0;
  top: 50px;
}

#right {
  right: 0;
  top: 50px;
}

/* 速度 */
#speedControls {
  position: absolute;
  right: 20px;
  top: 20px;
  display: flex;
  gap: 6px;
  z-index: 50;
}

/* ゲーム内時計 */
#gameClock {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 104px;
  padding: 8px 14px;
  border: 2px solid white;
  border-radius: 8px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-family: monospace;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-align: center;
  z-index: 50;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

#gameClock.late {
  color: #ffe36a;
  border-color: #ffe36a;
}

#gameClock.urgent {
  color: #fff;
  border-color: #ff705f;
  background: rgba(120,20,12,0.78);
}

/* 季節・気温・天候 */
#environmentPanel {
  position: absolute;
  top: 20px;
  left: 20px;
  min-width: 118px;
  padding: 9px 12px;
  border: 2px solid rgba(255,255,255,0.9);
  border-radius: 8px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-family: sans-serif;
  text-align: left;
  z-index: 50;
}

#seasonText {
  color: #8dd047;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.1em;
}

#temperatureText {
  margin: 3px 0 1px;
  font-size: 22px;
  font-weight: 900;
}

#weatherText {
  color: rgba(255,255,255,0.85);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.speedBtn {
  padding: 9px 11px;
  border: 2px solid white;
  border-radius: 7px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.speedBtn.active {
  background: white;
  color: black;
}

/* ENERGY */
#energyPanel {
  position: absolute;
  top: 70px;
  right: 20px;
  width: 180px;
  padding: 10px;
  background: rgba(0,0,0,0.65);
  border: 2px solid white;
  border-radius: 8px;
  color: white;
  font-family: sans-serif;
  z-index: 50;
}

#energyText {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

#energyBarOuter {
  width: 100%;
  height: 14px;
  border: 1px solid white;
  background: rgba(255,255,255,0.15);
  overflow: hidden;
}

#energyBarInner {
  width: 100%;
  height: 100%;
  background: white;
}

/* ミニマップ */
#minimap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 180px;
  border: 2px solid white;
  z-index: 30;
}

#miniMapImage {
  width: 100%;
  height: auto;
  display: block;
}

#miniPlayer {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#closeMap {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
}

#showMap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: none;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  z-index: 40;
}

/* 帰還確認画面 */
#returnModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  z-index: 100;
}

#returnBox {
  width: 280px;
  padding: 24px;
  background: white;
  border-radius: 12px;
  text-align: center;
  font-family: sans-serif;
}

#returnTitle {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

#returnButtons {
  display: flex;
  gap: 10px;
}

.returnBtn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

#returnYes {
  background: #111;
  color: white;
}

#returnNo {
  background: #ddd;
  color: #111;
}

/* 帰還後の今回の釣果 */
#tripResultModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,0.72);
  z-index: 110;
}

#tripResultBox {
  width: min(360px, 100%);
  max-height: min(620px, 88vh);
  overflow-y: auto;
  padding: 24px;
  box-sizing: border-box;
  border: 2px solid rgba(255,255,255,0.86);
  border-radius: 14px;
  background: #071c29;
  color: white;
  text-align: center;
}

#tripResultTitle {
  color: #8dd047;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#tripCatchCount {
  margin-top: 18px;
  font-size: 26px;
  font-weight: 900;
}

#tripBiggestLabel {
  margin-top: 20px;
  color: rgba(255,255,255,0.68);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.12em;
}

#tripBiggestSize {
  margin-top: 4px;
  font-size: 34px;
  font-weight: 900;
}

#tripNewRecord {
  display: none;
  margin-top: 6px;
  color: #f6d447;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.08em;
}

#tripCatchList {
  display: grid;
  gap: 7px;
  margin: 22px 0;
  padding: 16px 0;
  border-top: 1px solid rgba(255,255,255,0.22);
  border-bottom: 1px solid rgba(255,255,255,0.22);
  list-style: none;
}

#tripCatchList li {
  font-size: 18px;
  font-weight: 700;
}

#tripEmptyMessage {
  color: rgba(255,255,255,0.68);
}

#nextTripButton {
  width: 100%;
  padding: 12px;
  border: 2px solid white;
  border-radius: 9px;
  background: #8dd047;
  color: #071c29;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

/* HIT表示 */
#hitModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at center, rgba(0,70,118,0.28), rgba(0,0,0,0.72));
  z-index: 90;
}

#hitBox {
  width: min(440px, calc(100% - 32px));
  padding: 22px 24px 24px;
  background: rgba(5,30,48,0.18);
  backdrop-filter: blur(0.5px);
  border: 2px solid rgba(255,255,255,0.92);
  border-radius: 18px;
  color: white;
  text-align: center;
  font-family: sans-serif;
  box-shadow: 0 12px 36px rgba(0,0,0,0.45);
}

#hitTitle {
  font-size: 50px;
  font-weight: 900;
  letter-spacing: 0.08em;
  line-height: 1;
  text-shadow: 0 3px 12px rgba(0,0,0,0.5);
}

#hitSubtitle {
  margin: 8px 0 16px;
  color: rgba(255,255,255,0.84);
  font-size: 17px;
  font-weight: bold;
}

#timingGauge {
  position: relative;
  width: min(270px, 70vw);
  aspect-ratio: 1;
  margin: 0 auto 16px;
  border: 3px solid white;
  border-radius: 50%;
  background: transparent;
  box-shadow:
    0 0 0 2px rgba(0,0,0,0.2),
    0 0 28px rgba(32,170,255,0.28);
}

#timingGauge::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--gauge-zones);
  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 59%,
      #000 60%
    );
  mask:
    radial-gradient(
      circle,
      transparent 0 59%,
      #000 60%
    );
  z-index: 0;
}

#timingGauge::after {
  content: "";
  position: absolute;
  inset: 20%;
  border: 3px solid white;
  border-radius: 50%;
  background: rgba(0,0,0,0.04);
  z-index: 1;
}

#gaugeMarker {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  transform: rotate(0deg);
  z-index: 4;
  pointer-events: none;
}

#gaugeMarker::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -3px;
  width: 14%;
  height: 12px;
  border-radius: 999px;
  background: white;
  box-shadow:
    0 0 7px 3px white,
    0 0 16px 7px rgba(255,255,255,0.72);
  transform: translateX(-50%);
}

#hitLogo {
  position: absolute;
  inset: 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%;
  background: transparent;
  z-index: 3;
}

#hitLogoImage {
  display: block;
  width: var(--hit-logo-width, 110%);
  max-width: none;
  max-height: var(--hit-logo-max-height, 90%);
  object-fit: contain;
  object-position: center;
  filter:
    drop-shadow(0 2px 3px rgba(0,0,0,0.28));
}

#gaugeZoneResult {
  min-height: 25px;
  margin-bottom: 5px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.08em;
}

#catchResult {
  min-height: 40px;
  margin-bottom: 12px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

/* 魚とのファイト演出（画像・Canvasは使わない） */
#fightPanel {
  display: none;
  min-height: 300px;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

#fightStage {
  position: relative;
  width: min(390px, 82vw);
  height: 285px;
  overflow: hidden;
  border-radius: 14px;
  background:
    linear-gradient(
      to bottom,
      rgba(3,24,39,0.72) 0 63%,
      rgba(5,48,70,0.78) 64% 100%
    );
}

#fightScene {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

#fightRodPath {
  fill: none;
  stroke: #f5f5f1;
  stroke-width: 7;
  stroke-linecap: round;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.55));
}

#fightRodHandle {
  fill: none;
  stroke: #111;
  stroke-width: 13;
  stroke-linecap: round;
}

#fightLinePath {
  fill: none;
  stroke: rgba(255,255,255,0.92);
  stroke-width: 2;
  stroke-linecap: round;
  filter: drop-shadow(0 0 2px rgba(255,255,255,0.65));
}

.fightWaterLine {
  fill: none;
  stroke: rgba(255,255,255,0.3);
  stroke-width: 2;
  stroke-linecap: round;
}

#fightRipple,
#fightRippleEcho {
  fill: none;
  stroke: rgba(255,255,255,0.54);
  stroke-width: 2;
  transform-box: fill-box;
  transform-origin: center;
  animation: fightRipple 1.35s ease-out infinite;
}

#fightRippleEcho {
  opacity: 0.45;
  animation-delay: -0.68s;
}

#fightSplash {
  opacity: 0;
  transition: opacity 0.09s ease;
}

#fightSplash path {
  fill: none;
  stroke: rgba(255,255,255,0.82);
  stroke-width: 3;
  stroke-linecap: round;
}

#fightPanel.strong-pull #fightRipple,
#fightPanel.strong-pull #fightRippleEcho {
  stroke-width: 3;
  animation-duration: 0.7s;
}

#fightPanel.strong-pull #fightSplash {
  opacity: var(--splash-opacity, 0.72);
}

@keyframes fightRipple {
  from {
    opacity: 0.68;
    transform: scale(0.35);
  }
  to {
    opacity: 0;
    transform: scale(1.75);
  }
}

#catchPanel {
  display: none;
  min-height: 270px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 14px;
}

#catchImageSlot {
  display: none;
  width: min(260px, 72vw);
  min-height: 110px;
}

#catchPanelTitle {
  color: #8dd047;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.55);
}

#catchSpecies {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#catchSize {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 0.04em;
}

#catchNewRecord {
  display: none;
  color: #f6d447;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.08em;
}

#fishButton,
#hitContinue {
  width: min(280px, 100%);
  padding: 12px;
  border: 2px solid white;
  border-radius: 10px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#fishButton {
  background: rgba(3,39,64,0.92);
  color: white;
}

#hitContinue {
  display: none;
  background: white;
  color: #111;
}

@media (max-width: 600px) {

  #boat {
    width: 36px;
  }

  #minimap {
    width: 130px;
  }

  #speedControls {
    right: 10px;
    top: 10px;
  }

  #energyPanel {
    right: 10px;
    top: 60px;
    width: 150px;
  }

  #environmentPanel {
    left: 10px;
    top: 60px;
    min-width: 104px;
    padding: 8px 10px;
  }

  #temperatureText {
    font-size: 19px;
  }

  .speedBtn {
    padding: 8px;
    font-size: 11px;
  }

  #hitBox {
    padding: 18px 16px;
  }

  #hitTitle {
    font-size: 42px;
  }

  #timingGauge {
    width: min(230px, 64vw);
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="world">
    <img id="map" src="map.jpg" alt="Game Map">
  </div>

  <img id="boat" src="boat.png" alt="Boat">

  <div id="speedControls">
    <button id="lowSpeed" class="speedBtn">SLOW</button>
    <button id="normalSpeed" class="speedBtn active">NORMAL</button>
    <button id="highSpeed" class="speedBtn">FAST</button>
  </div>

  <div id="gameClock" aria-label="ゲーム内時刻">06:00</div>

  <div id="environmentPanel" aria-label="環境情報">
    <div id="seasonText">SPRING</div>
    <div id="temperatureText">12°C</div>
    <div id="weatherText">SUNNY</div>
  </div>

  <div id="energyPanel">
    <div id="energyText">ENERGY 100%</div>

    <div id="energyBarOuter">
      <div id="energyBarInner"></div>
    </div>
  </div>

  <div id="controls">
    <button id="up" class="control">↑</button>
    <button id="down" class="control">↓</button>
    <button id="left" class="control">←</button>
    <button id="right" class="control">→</button>
  </div>

  <div id="minimap">
    <img id="miniMapImage" src="map.jpg" alt="Mini Map">
    <div id="miniPlayer"></div>
    <button id="closeMap">×</button>
  </div>

  <button id="showMap">MAP</button>

  <!-- 帰還確認 -->
  <div id="returnModal">
    <div id="returnBox">

      <div id="returnTitle">
        桟橋に帰還しますか？
      </div>

      <div id="returnButtons">
        <button id="returnNo" class="returnBtn">
          NO
        </button>

        <button id="returnYes" class="returnBtn">
          YES
        </button>
      </div>

    </div>
  </div>

  <div id="tripResultModal" role="dialog" aria-modal="true" aria-labelledby="tripResultTitle">
    <section id="tripResultBox">
      <div id="tripResultTitle">TODAY'S CATCH</div>
      <div id="tripCatchCount">0 FISH</div>
      <div id="tripBiggestLabel">BIGGEST</div>
      <div id="tripBiggestSize">--</div>
      <div id="tripNewRecord">NEW RECORD!</div>
      <ul id="tripCatchList" aria-label="今回釣った魚サイズ一覧"></ul>
      <button id="nextTripButton">NEXT TRIP</button>
    </section>
  </div>

  <!-- FISHタイミングゲージ -->
  <div id="hitModal" role="dialog" aria-modal="true" aria-labelledby="hitTitle">
    <div id="hitBox">
      <div id="hitTitle">HIT!</div>
      <div id="hitSubtitle">魚が食いついた！</div>

      <div id="timingGauge" aria-label="FISH timing gauge">
        <div id="gaugeMarker"></div>

        <!-- ゲージ判定から独立したロゴ表示領域 -->
        <div id="hitLogo" data-logo-state="normal">
          <img id="hitLogoImage" alt="GREEN BOAT">
        </div>
      </div>

      <div id="gaugeZoneResult" aria-live="polite"></div>
      <div id="catchResult" aria-live="polite"></div>

      <!-- 魚を表示せず、ロッド・ライン・水面だけで見せるファイト画面 -->
      <section id="fightPanel" aria-label="魚とのファイト中">
        <div id="fightStage">
          <svg id="fightScene" viewBox="0 0 420 285" aria-hidden="true">
            <path class="fightWaterLine" d="M0 205 C70 199 135 211 210 205 S350 199 420 205" />
            <path class="fightWaterLine" d="M0 229 C90 223 145 235 235 229 S350 224 420 229" />
            <ellipse id="fightRipple" cx="306" cy="207" rx="45" ry="12" />
            <ellipse id="fightRippleEcho" cx="306" cy="207" rx="30" ry="8" />
            <g id="fightSplash">
              <path d="M290 202 Q282 186 286 176" />
              <path d="M306 201 Q305 180 313 168" />
              <path d="M322 202 Q332 187 332 178" />
            </g>
            <path id="fightRodHandle" d="M62 262 L86 232" />
            <path id="fightRodPath" d="M78 242 Q164 111 263 73" />
            <path id="fightLinePath" d="M263 73 Q292 132 306 207" />
          </svg>
        </div>
      </section>

      <!-- 将来、魚画像を追加できる独立した釣果画面 -->
      <section id="catchPanel" aria-live="polite">
        <div id="catchImageSlot" aria-hidden="true"></div>
        <div id="catchPanelTitle">CATCH!</div>
        <div id="catchSpecies">BLACK BASS</div>
        <div id="catchSize"></div>
        <div id="catchNewRecord">NEW RECORD!</div>
      </section>

      <button id="fishButton">FISH!</button>
      <button id="hitContinue">CONTINUE</button>
    </div>
  </div>

</div>

<script src="save-system.js"></script>
<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const map = document.getElementById("map");
const boat = document.getElementById("boat");

const miniPlayer = document.getElementById("miniPlayer");
const minimap = document.getElementById("minimap");
const closeMap = document.getElementById("closeMap");
const showMap = document.getElementById("showMap");

const energyText = document.getElementById("energyText");
const energyBarInner = document.getElementById("energyBarInner");
const gameClock = document.getElementById("gameClock");
const seasonText = document.getElementById("seasonText");
const temperatureText = document.getElementById("temperatureText");
const weatherText = document.getElementById("weatherText");

const returnModal = document.getElementById("returnModal");
const returnYes = document.getElementById("returnYes");
const returnNo = document.getElementById("returnNo");
const tripResultModal = document.getElementById("tripResultModal");
const tripCatchCount = document.getElementById("tripCatchCount");
const tripBiggestSize = document.getElementById("tripBiggestSize");
const tripNewRecord = document.getElementById("tripNewRecord");
const tripCatchList = document.getElementById("tripCatchList");
const nextTripButton = document.getElementById("nextTripButton");

const hitModal = document.getElementById("hitModal");
const hitTitle = document.getElementById("hitTitle");
const hitSubtitle = document.getElementById("hitSubtitle");
const timingGauge = document.getElementById("timingGauge");
const gaugeMarker = document.getElementById("gaugeMarker");
const hitLogo = document.getElementById("hitLogo");
const hitLogoImage = document.getElementById("hitLogoImage");
const gaugeZoneResult = document.getElementById("gaugeZoneResult");
const catchResult = document.getElementById("catchResult");
const fightPanel = document.getElementById("fightPanel");
const fightStage = document.getElementById("fightStage");
const fightRodPath = document.getElementById("fightRodPath");
const fightLinePath = document.getElementById("fightLinePath");
const fightRipple = document.getElementById("fightRipple");
const fightRippleEcho = document.getElementById("fightRippleEcho");
const fightSplash = document.getElementById("fightSplash");
const catchPanel = document.getElementById("catchPanel");
const catchSpecies = document.getElementById("catchSpecies");
const catchSize = document.getElementById("catchSize");
const catchNewRecord = document.getElementById("catchNewRecord");
const fishButton = document.getElementById("fishButton");
const hitContinue = document.getElementById("hitContinue");


/* =========================
   永続セーブ
========================= */

const saveRepository =

function isWater(
  xPercent,
  yPercent
) {

  if (!mapReady) {
    return true;
  }

  const px =
    Math.floor(
      collisionCanvas.width *
      xPercent / 100
    );

  const py =
    Math.floor(
      collisionCanvas.height *
      yPercent / 100
    );

  if (
    px < 0 ||
    py < 0 ||
    px >= collisionCanvas.width ||
    py >= collisionCanvas.height
  ) {
    return false;
  }

  const pixel =
    collisionCtx.getImageData(
      px,
      py,
      1,
      1
    ).data;

  const r = pixel[0];
  const g = pixel[1];
  const b = pixel[2];

  return (
    b > 100 &&
    b > r * 1.25 &&
    b > g * 1.05
  );
}

function distanceFromDock() {

  const dx =
    playerX - dockX;

  const dy =
    playerY - dockY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}

function getFishingAreaCoordinates(
  xPercent,
  yPercent
) {

  const column = Math.min(
    fishingGrid.columns - 1,
    Math.max(
      0,
      Math.floor(
        xPercent /
        100 *
        fishingGrid.columns
      )
    )
  );

  const row = Math.min(
    fishingGrid.rows - 1,
    Math.max(
      0,
      Math.floor(
        yPercent /
        100 *
        fishingGrid.rows
      )
    )
  );

  return {
    column,
    row,
    key: `${column}:${row}`
  };
}


function getFishingArea(
  xPercent,
  yPercent
) {

  const coordinates =
    getFishingAreaCoordinates(
      xPercent,
      yPercent
    );

  if (
    !fishingAreaCache.has(
      coordinates.key
    )
  ) {

    fishingAreaCache.set(
      coordinates.key,
      {
        id: coordinates.key,
        column: coordinates.column,
        row: coordinates.row,
        ...defaultFishingAreaSettings,
        ...(
          fishingAreaOverrides[
            coordinates.key
          ] || {}
        )
      }
    );
  }

  return fishingAreaCache.get(
    coordinates.key
  );
}

function randomBetween(
  minimum,
  maximum
) {

  return (
    minimum +
    Math.random() *
    (
      maximum -
      minimum
    )
  );
}


function chooseWeightedFishSizeBand(
  bands
) {

  const totalWeight = bands.reduce(
    (total, band) => total + band.weight,
    0
  );

  let selection =
    Math.random() * totalWeight;

  return bands.find((band) => {
    selection -= band.weight;
    return selection < 0;
  }) || bands[bands.length - 1];
}

/*
  中央ロゴの表示処理。
  ゲージ判定とは独立しており、将来は画像や色演出に差し替えられる。
*/
function createTransparentLogoSource(
  imagePath
) {

  if (
    processedLogoCache.has(
      imagePath
    )
  ) {
    return processedLogoCache.get(
      imagePath
    );
  }

  const processingPromise =
    new Promise(
      (resolve) => {

        const sourceImage =
          new Image();

        sourceImage.addEventListener(
          "load",
          () => {

            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              sourceImage.naturalWidth;

            canvas.height =
              sourceImage.naturalHeight;

            const context =
              canvas.getContext(
                "2d",
                {
                  willReadFrequently:
                    true
                }
              );

            context.drawImage(
              sourceImage,
              0,
              0
            );

            const imageData =
              context.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
              );

            const pixelCount =
              canvas.width *
              canvas.height;

            const visited =
              new Uint8Array(
                pixelCount
              );

            const queue =
              new Int32Array(
                pixelCount
              );

            let queueStart = 0;
            let queueEnd = 0;

            const backgroundColor = [
              imageData.data[0],
              imageData.data[1],
              imageData.data[2]
            ];

            const isBackgroundPixel =
              (pixelIndex) => {

                const dataIndex =
                  pixelIndex *
                  4;

                const redDifference =
                  Math.abs(
                    imageData.data[
                      dataIndex
                    ] -
                    backgroundColor[0]
                  );

                const greenDifference =
                  Math.abs(
                    imageData.data[
                      dataIndex + 1
                    ] -
                    backgroundColor[1]
                  );

                const blueDifference =
                  Math.abs(
                    imageData.data[
                      dataIndex + 2
                    ] -
                    backgroundColor[2]
                  );

                return (
                  redDifference <= 12 &&
                  greenDifference <= 12 &&
                  blueDifference <= 12
                );
              };

            const enqueue =
              (pixelIndex) => {

                if (
                  visited[pixelIndex] ||
                  !isBackgroundPixel(
                    pixelIndex
                  )
                ) {
                  return;
                }

                visited[pixelIndex] = 1;
                queue[queueEnd] =
                  pixelIndex;
                queueEnd += 1;
              };

            for (
              let x = 0;
              x < canvas.width;
              x += 1
            ) {
              enqueue(x);
              enqueue(
                (
                  canvas.height -
                  1
                ) *
                canvas.width +
                x
              );
            }

            for (
              let y = 0;
              y < canvas.height;
              y += 1
            ) {
              enqueue(
                y *
                canvas.width
              );
              enqueue(
                y *
                canvas.width +
                canvas.width -
                1
              );
            }

            while (
              queueStart <
              queueEnd
            ) {

              const pixelIndex =
                queue[queueStart];

              queueStart += 1;

              imageData.data[
                pixelIndex *
                4 +
                3
              ] = 0;

              const x =
                pixelIndex %
                canvas.width;

              if (x > 0) {
                enqueue(
                  pixelIndex -
                  1
                );
              }

              if (
                x <
                canvas.width -
                1
              ) {
                enqueue(
                  pixelIndex +
                  1
                );
              }

              if (
                pixelIndex >=
                canvas.width
              ) {
                enqueue(
                  pixelIndex -
                  canvas.width
                );
              }

              if (
                pixelIndex <
                pixelCount -
                canvas.width
              ) {
                enqueue(
                  pixelIndex +
                  canvas.width
                );
              }
            }

            context.putImageData(
              imageData,
              0,
              0
            );

            resolve(
              canvas.toDataURL(
                "image/png"
              )
            );
          }
        );

        sourceImage.addEventListener(
          "error",
          () => resolve(imagePath)
        );

        sourceImage.src = imagePath;
      }
    );

  processedLogoCache.set(
    imagePath,
    processingPromise
  );

  return processingPromise;
}

function applyFishingGaugeZones() {

  const bestWidth =
    fishingGaugeSettings
      .bestZoneDegrees;

  const goodWidth =
    fishingGaugeSettings
      .goodZoneDegrees;

  const startAngle =
    -bestWidth / 2;

  const firstGoodEnd =
    bestWidth +
    goodWidth;

  const secondGoodStart =
    360 -
    goodWidth;

  timingGauge.style.setProperty(
    "--gauge-zones",
    `conic-gradient(
      from ${startAngle}deg,
      ${fishingGaugeColors.best} 0deg ${bestWidth}deg,
      ${fishingGaugeColors.good} ${bestWidth}deg ${firstGoodEnd}deg,
      ${fishingGaugeColors.normal} ${firstGoodEnd}deg ${secondGoodStart}deg,
      ${fishingGaugeColors.good} ${secondGoodStart}deg 360deg
    )`
  );
}

function runGaugeAnimation(
  currentFrameTime
) {

  if (
    fishingSequenceState !==
    "gauge"
  ) {
    return;
  }

  if (
    gaugePreviousFrameTime ===
    null
  ) {
    gaugePreviousFrameTime =
      currentFrameTime;
  }

  const deltaSeconds = Math.min(
    (
      currentFrameTime -
      gaugePreviousFrameTime
    ) /
    1000,
    0.05
  );

  gaugePreviousFrameTime =
    currentFrameTime;

  gaugeMarkerAngle =
    (
      gaugeMarkerAngle +
      fishingGaugeSettings
        .markerSpeedDegreesPerSecond *
      deltaSeconds
    ) %
    360;

  updateGaugeMarker();

  gaugeAnimationFrameId =
    requestAnimationFrame(
      runGaugeAnimation
    );
}

function getGaugeZone(
  markerAngle
) {

  const signedAngle =
    (
      (
        markerAngle +
        180
      ) %
      360
    ) -
    180;

  const distanceFromBest =
    Math.abs(signedAngle);

  const bestHalfWidth =
    fishingGaugeSettings
      .bestZoneDegrees /
    2;

  if (
    distanceFromBest <=
    bestHalfWidth
  ) {
    return "best";
  }

  if (
    distanceFromBest <=
    bestHalfWidth +
    fishingGaugeSettings
      .goodZoneDegrees
  ) {
    return "good";
  }

  return "normal";
}


function getFishFightProfile(
  fishSize
) {

  const sizeBand =
    fishFightSettings
      .sizeBands
      .find(
        band =>
          fishSize <=
          band.maximumSize
      );

  const baseDuration =
    randomBetween(
      sizeBand.minimumSeconds,
      sizeBand.maximumSeconds
    );

  const randomDurationFactor =
    randomBetween(
      1 -
        fishFightSettings
          .durationRandomness,
      1 +
        fishFightSettings
          .durationRandomness
    );

  const sizeStrength =
    Math.max(
      0,
      Math.min(
        1,
        (fishSize - 20) / 35
      )
    );

  return {
    durationMilliseconds:
      Math.round(
        baseDuration *
        randomDurationFactor *
        1000
      ),
    intensity:
      Math.max(
        0.5,
        Math.min(
          1.15,
          0.56 +
            sizeStrength * 0.48 +
            randomBetween(-0.1, 0.1)
        )
      ),
    strongPullChance:
      0.2 +
      sizeStrength * 0.34,
    quietBeatChance:
      0.08 +
      sizeStrength * 0.2
  };
}


function getMissFightProfile() {

  const durationRoll =
    Math.random();

  let durationRange =
    fishFightSettings
      .missDurations
      .medium;

  if (
    durationRoll <
    fishFightSettings
      .missDurations
      .shortChance
  ) {
    durationRange =
      fishFightSettings
        .missDurations
        .short;

  } else if (
    durationRoll >=
    1 -
      fishFightSettings
        .missDurations
        .longChance
  ) {
    durationRange =
      fishFightSettings
        .missDurations
        .long;
  }

  const durationSeconds =
    randomBetween(
      durationRange.minimumSeconds,
      durationRange.maximumSeconds
    );

  /*
    MISSでも大型魚と同じ強さ・長さが混ざる。
    動きだけで成否を確定予測できないようにする。
  */
  const intensity =
    randomBetween(0.52, 1.13);

  return {
    durationMilliseconds:
      Math.round(
        durationSeconds *
        randomBetween(0.84, 1.16) *
        1000
      ),
    intensity,
    strongPullChance:
      randomBetween(0.2, 0.55),
    quietBeatChance:
      randomBetween(0.08, 0.29)
  };
}


function updateFishFightAnimation() {

  if (
    fishingSequenceState !==
    "fight"
  ) {
    return;
  }

  fightPullCurrent +=
    (
      fightPullTarget -
      fightPullCurrent
    ) *
    0.13;

  fightBendCurrent +=
    (
      fightBendTarget -
      fightBendCurrent
    ) *
    0.11;

  const tipX =
    263 +
    fightPullCurrent * 0.22;

  const tipY =
    73 +
    fightBendCurrent * 29;

  const waterX =
    306 +
    fightPullCurrent;

  fightRodPath.setAttribute(
    "d",
    `M78 242 Q${
      164 +
      fightPullCurrent * 0.1
    } ${
      111 +
      fightBendCurrent * 19
    } ${tipX} ${tipY}`
  );

  fightLinePath.setAttribute(
    "d",
    `M${tipX} ${tipY} Q${
      (tipX + waterX) / 2
    } ${
      130 +
      fightBendCurrent * 4
    } ${waterX} 207`
  );

  fightRipple.setAttribute(
    "cx",
    waterX
  );

  fightRippleEcho.setAttribute(
    "cx",
    waterX
  );

  fightSplash.setAttribute(
    "transform",
    `translate(${waterX - 306} 0)`
  );

  fightAnimationFrameId =
    requestAnimationFrame(
      updateFishFightAnimation
    );
}


function scheduleFishFightBeat(
  profile
) {

  if (
    fishingSequenceState !==
    "fight"
  ) {
    return;
  }

  const quietBeat =
    Math.random() <
    profile.quietBeatChance;

  const strongPull =
    !quietBeat &&
    Math.random() <
      profile.strongPullChance;

  if (quietBeat) {

    fightPullTarget =
      randomBetween(-7, 7);

    fightBendTarget =
      randomBetween(0.12, 0.28);

  } else {

    const direction =
      Math.random() < 0.5 ?
        -1 :
        1;

    const pullRange =
      strongPull ?
        randomBetween(34, 51) :
        randomBetween(14, 31);

    fightPullTarget =
      direction *
      pullRange *
      profile.intensity;

    fightBendTarget =
      (
        strongPull ?
          randomBetween(0.76, 1) :
          randomBetween(0.38, 0.7)
      ) *
      profile.intensity;
  }

  fightPanel.classList.toggle(
    "strong-pull",
    strongPull
  );

  const nextBeatDelay =
    quietBeat ?
      randomBetween(260, 430) :
      randomBetween(150, 310);

  fightBeatTimeoutId =
    setTimeout(
      () =>
        scheduleFishFightBeat(
          profile
        ),
      nextBeatDelay
    );
}


function clearFishFightAnimation() {

  if (
    fightAnimationFrameId !==
    null
  ) {
    cancelAnimationFrame(
      fightAnimationFrameId
    );
  }

  clearTimeout(
    fightBeatTimeoutId
  );

  clearTimeout(
    fightFinishTimeoutId
  );

  fightAnimationFrameId = null;
  fightBeatTimeoutId = null;
  fightFinishTimeoutId = null;

  fightPanel.classList.remove(
    "strong-pull"
  );
}


function startFishFight(
  fightResult
) {

  clearFishFightAnimation();

  pendingFightResult =
    fightResult;

  fishingSequenceState = "fight";

  const fightProfile =
    fightResult.caught ?
      getFishFightProfile(
        fightResult
          .caughtFish
          .sizeCm
      ) :
      getMissFightProfile();

  hitTitle.style.display = "none";
  hitSubtitle.style.display = "none";
  timingGauge.style.display = "none";
  gaugeZoneResult.style.display = "none";
  catchResult.style.display = "none";
  catchPanel.style.display = "none";
  fightPanel.style.display = "flex";
  fishButton.style.display = "none";
  hitContinue.style.display = "none";

  fightPanel.dataset.durationMilliseconds =
    String(
      fightProfile
        .durationMilliseconds
    );

  fightPanel.style.setProperty(
    "--splash-opacity",
    String(
      Math.min(
        0.88,
        0.48 +
          fightProfile.intensity *
          0.3
      )
    )
  );

  fightPullCurrent = 0;
  fightPullTarget =
    randomBetween(-18, 18) *
    fightProfile.intensity;
  fightBendCurrent = 0;
  fightBendTarget =
    0.85 *
    fightProfile.intensity;

  fightPanel.classList.add(
    "strong-pull"
  );

  updateFishFightAnimation();

  fightBeatTimeoutId =
    setTimeout(
      () =>
        scheduleFishFightBeat(
          fightProfile
        ),
      220
  );

  fightFinishTimeoutId =
    setTimeout(
      finishFishFight,
      fightProfile
        .durationMilliseconds
    );
}


function finishFishFight() {

/* =========================
   季節・気温・天候
========================= */

function chooseWeightedValue(
  weights
) {

  const entries =
    Object.entries(weights);

  const totalWeight =
    entries.reduce(
      (total, entry) =>
        total + entry[1],
      0
    );

  let remaining =
    Math.random() *
    totalWeight;

  for (const [value, weight] of entries) {

    remaining -= weight;

    if (remaining <= 0) {
      return value;
    }
  }

  return entries.at(-1)[0];
}


function chooseNextWeather() {

  const transitionWeights =
    environmentSettings
      .transitionWeights[
        environmentState.weather
      ];

  const seasonalWeights =
    environmentSettings
      .weatherProbabilities[
        environmentState.season
      ];

  const combinedWeights = {};

  for (
    const weather of
    Object.keys(seasonalWeights)
  ) {
    combinedWeights[weather] =
      transitionWeights[weather] *
      seasonalWeights[weather];
  }

  return chooseWeightedValue(
    combinedWeights
  );
}


function scheduleNextWeatherCheck(
  fromGameMinutes
) {

  environmentState
    .nextWeatherChangeMinutes =
      fromGameMinutes +
      randomBetween(
        environmentSettings
          .weatherDurationMinutes
          .minimum,
        environmentSettings
          .weatherDurationMinutes
          .maximum
      );
}


function initializeEnvironment() {

  const configuredSeason =
    environmentSettings
      .selectedSeason;

  environmentState.season =
    environmentSettings
      .seasons
      .includes(configuredSeason) ?
        configuredSeason :
        environmentSettings
          .seasons[
            Math.floor(
              Math.random() *
              environmentSettings
                .seasons.length
            )
          ];

  const temperatureOffsetMagnitude =
    randomBetween(
      environmentSettings
        .dailyTemperatureOffset
        .minimum,
      environmentSettings
        .dailyTemperatureOffset
        .maximum
    );

  environmentState.temperatureOffset =
    (
      Math.random() < 0.5 ?
        -1 :
        1
    ) *
    temperatureOffsetMagnitude;

  environmentState.weather =
    chooseWeightedValue(
      environmentSettings
        .weatherProbabilities[
          environmentState.season
        ]
    );

  scheduleNextWeatherCheck(
    gameMinutes
  );

  updateEnvironment();
}


function getCurrentTemperature() {

  const temperatureCurve =
    environmentSettings
      .temperatureCurves[
        environmentState.season
      ];

  for (
    let index = 0;
    index < temperatureCurve.length - 1;
    index += 1
  ) {

    const [startMinute, startTemperature] =
      temperatureCurve[index];

    const [endMinute, endTemperature] =
      temperatureCurve[index + 1];

    if (
      gameMinutes <= endMinute
    ) {

      const progress =
        Math.max(
          0,
          Math.min(
            1,
            (
              gameMinutes -
              startMinute
            ) /
            (
              endMinute -
              startMinute
            )
          )
        );

      return (
        startTemperature +
        (
          endTemperature -
          startTemperature
        ) *
        progress +
        environmentState
          .temperatureOffset
      );
    }
  }

  return (
    temperatureCurve.at(-1)[1] +
    environmentState
      .temperatureOffset
  );
}


function updateEnvironment() {

  while (
    gameMinutes >=
      environmentState
        .nextWeatherChangeMinutes &&
    environmentState
      .nextWeatherChangeMinutes <
      gameTimeSettings.endMinutes
  ) {

    const weatherChangeMinute =
      environmentState
        .nextWeatherChangeMinutes;

    environmentState.weather =
      chooseNextWeather();

    scheduleNextWeatherCheck(
      weatherChangeMinute
    );
  }

  seasonText.textContent =
    environmentState.season;

  temperatureText.textContent =
    getCurrentTemperature()
      .toFixed(1) +
    "°C";

  weatherText.textContent =
    environmentState.weather;
}


/* =========================
   時刻表示・進行
========================= */

function updateGameClock() {

  const displayMinutes =
    Math.min(
      Math.floor(gameMinutes),
      gameTimeSettings.endMinutes
    );

  const hours =
    Math.floor(displayMinutes / 60);

  const minutes =
    displayMinutes % 60;

  gameClock.textContent =
    String(hours).padStart(2, "0") +
    ":" +
    String(minutes).padStart(2, "0");

  gameClock.classList.toggle(
    "late",
    displayMinutes >=
      gameTimeSettings.lateWarningMinutes
  );

  gameClock.classList.toggle(
    "urgent",
    displayMinutes >=
      gameTimeSettings.urgentWarningMinutes
  );
}


function shouldGameTimeAdvance() {

  return !(
    tripResultOpen ||
    (
      hitPromptOpen &&
      fishingSequenceState === "result"
    )
  );
}


function updateGameTime(deltaSeconds) {

  if (
    gameMinutes >=
      gameTimeSettings.endMinutes ||
    !shouldGameTimeAdvance()
  ) {
    return;
  }

  gameMinutes =
    Math.min(
      gameTimeSettings.endMinutes,
      gameMinutes +
        deltaSeconds *
        gameTimeSettings
          .gameMinutesPerRealSecond
    );

  updateGameClock();
  updateEnvironment();

  if (
    gameMinutes >=
      gameTimeSettings.endMinutes &&
    distanceFromDock() >
      dockReturnRadius
  ) {
    failTrip("RETURN TIME OVER");
  }
}

/* =========================
   ゲームループ
========================= */

let previousFrameTime = null;

function gameLoop(currentFrameTime) {

  if (previousFrameTime === null) {
    previousFrameTime = currentFrameTime;
  }

  /*
    時計は実際に経過した秒数を使う。
    船の移動は大きな画面停止後に飛ばないよう、
    従来どおり1フレーム分を制限する。
  */
  const elapsedRealSeconds =
    Math.max(
      0,
      (
        currentFrameTime -
        previousFrameTime
      ) / 1000
    );

  const movementDeltaSeconds =
    Math.min(
      elapsedRealSeconds,
      0.05
    );

  previousFrameTime = currentFrameTime;

  updateGameTime(
    elapsedRealSeconds
  );

  let dx = 0;
  let dy = 0;

  /*
    帰還確認中・HIT表示中は船を止める
  */
  if (
    !returnPromptOpen &&
    !hitPromptOpen &&
    gameMinutes <
      gameTimeSettings.endMinutes
  ) {

    if (keys.up) {
      dy -= 1;
    }

    if (keys.down) {
      dy += 1;
    }

    if (keys.left) {
      dx -= 1;
    }

    if (keys.right) {
      dx += 1;
    }


    if (
      dx !== 0 ||
      dy !== 0
    ) {

      /*
        斜め移動でも速度を一定にする
      */
      const directionLength =
        Math.hypot(dx, dy);

      dx =
        dx /
        directionLength *
        speed *
        movementDeltaSeconds;

      dy =
        dy /
        directionLength *
        speed *
        movementDeltaSeconds;

      const nextX =
        playerX + dx;

      const nextY =
        playerY + dy;


      /*
        船の中心が水面なら移動
      */
      if (
        isWater(
          nextX,
          nextY
        )
      ) {

        playerX = nextX;
        playerY = nextY;


        /*
          ENERGY消費
        */
        energy -=
          fuelSettings
            .normalUsePerSecond *
          fuelSettings
            .speedMultipliers[
            speedMode
            ] *
          movementDeltaSeconds;


        const dockDistance =
          distanceFromDock();


        /*
          桟橋から離れたら
          出船成立
        */
        if (
          !hasLeftDock &&
          dockDistance >
          dockLeaveRadius
        ) {

          hasLeftDock = true;
        }


        /*
          NOを押したあと
          一度桟橋から離れれば
          再び帰還確認可能
        */
        if (
          returnPromptBlocked &&
          dockDistance >
          dockLeaveRadius
        ) {

          returnPromptBlocked = false;
        }


        /*
          桟橋に戻った
        */
        if (
          hasLeftDock &&
          !returnPromptBlocked &&
          dockDistance <=
          dockReturnRadius
        ) {

          openReturnPrompt();
        }


        /*
          ENERGY切れ
        */
        if (
          energy <= 0 &&
          !returnPromptOpen
        ) {

          failTrip("FUEL EMPTY");

        } else if (
          !returnPromptOpen
        ) {

          /*
            新しい釣りエリアに入った時だけ
            HIT抽選を行う
          */
          checkFishingAreaEntry();
        }
      }


      /*
        船の向き
      */
      const angle =
        Math.atan2(
          dy,
          dx
        ) *
        180 /
        Math.PI +
        180;

      boat.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg)`;
    }
  }


  updateEnergy();

  updateWorld();

  requestAnimationFrame(
    gameLoop
  );
}

document.addEventListener(

  (e) => {

    if (hitPromptOpen) {

      if (e.code === "Space") {
        e.preventDefault();

        }

      return;
    }

    if (e.key === "ArrowDown") {
      keys.down = true;
    }

    if (e.key === "ArrowLeft") {
      keys.left = true;

    if (e.key === "ArrowRight") {
      keys.right = true;

    if (
      e.key.startsWith(

      e.preventDefault();
    }
  }
);

function setupButton(

    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();

      if (
        returnPromptOpen ||
        hitPromptOpen
      ) {
        return;
      }

      keys[direction] = true;
    }
  );

  const stop = () => {
    keys[direction] = false;
  };

  button.addEventListener(
    "pointerup",
    stop
  );

  button.addEventListener(
    "pointerleave",
    stop
  );

  button.addEventListener(
    "pointercancel",
    stop
  );
}


setupButton("up", "up");
setupButton("down", "down");
setupButton("left", "left");
setupButton("right", "right");


/* =========================
   速度切替
========================= */

const lowButton =
  document.getElementById(
    "lowSpeed"
  );

const normalButton =
  document.getElementById(
    "normalSpeed"
  );

const highButton =
  document.getElementById(
    "highSpeed"
  );


function changeSpeed(mode) {

  speedMode = mode;

  speed =
    speeds[mode];

  document
    .querySelectorAll(
      ".speedBtn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );
      }
    );

  if (mode === "low") {
    lowButton.classList.add(
      "active"
    );
  }

  if (mode === "normal") {
    normalButton.classList.add(
      "active"
    );
  }

  if (mode === "high") {
    highButton.classList.add(
      "active"
    );
  }
}


lowButton.addEventListener(
  "click",
  () => changeSpeed("low")
);

normalButton.addEventListener(
  "click",
  () => changeSpeed("normal")
);

highButton.addEventListener(
  "click",
  () => changeSpeed("high")
);


/* =========================
   ミニマップ
========================= */

closeMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "none";

    showMap.style.display =
      "block";
  }
);


showMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "block";

    showMap.style.display =
      "none";
  }
);


window.addEventListener(
  "resize",
  updateWorld
);


updateEnergy();
updateGameClock();
initializeEnvironment();

currentFishingAreaKey =
  getFishingArea(
    playerX,
    playerY
  ).id;

requestAnimationFrame(
  gameLoop
);

</script>
