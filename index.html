<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusty Bridge Game</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#game {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

/* フィールド */
#world {
  position: absolute;
  left: 0;
  top: 0;
  height: 900%;
}

#map {
  height: 100%;
  width: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* ボート */
#boat {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  transform: translate(-50%, -50%) rotate(180deg);
  transform-origin: center;
  z-index: 20;
  pointer-events: none;
}

/* 操作 */
#controls {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 150px;
  height: 150px;
  z-index: 40;
}

.control {
  position: absolute;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  font-size: 24px;
  font-weight: bold;
  touch-action: none;
}

#up {
  left: 50px;
  top: 0;
}

#down {
  left: 50px;
  bottom: 0;
}

#left {
  left: 0;
  top: 50px;
}

#right {
  right: 0;
  top: 50px;
}

/* 速度 */
#speedControls {
  position: absolute;
  right: 20px;
  top: 20px;
  display: flex;
  gap: 6px;
  z-index: 50;
}

.speedBtn {
  padding: 9px 11px;
  border: 2px solid white;
  border-radius: 7px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.speedBtn.active {
  background: white;
  color: black;
}

/* ENERGY */
#energyPanel {
  position: absolute;
  top: 70px;
  right: 20px;
  width: 180px;
  padding: 10px;
  background: rgba(0,0,0,0.65);
  border: 2px solid white;
  border-radius: 8px;
  color: white;
  font-family: sans-serif;
  z-index: 50;
}

#energyText {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

#energyBarOuter {
  width: 100%;
  height: 14px;
  border: 1px solid white;
  background: rgba(255,255,255,0.15);
  overflow: hidden;
}

#energyBarInner {
  width: 100%;
  height: 100%;
  background: white;
}

/* ミニマップ */
#minimap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 180px;
  border: 2px solid white;
  z-index: 30;
}

#miniMapImage {
  width: 100%;
  height: auto;
  display: block;
}

#miniPlayer {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#closeMap {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
}

#showMap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: none;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  z-index: 40;
}

/* 帰還確認画面 */
#returnModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  z-index: 100;
}

#returnBox {
  width: 280px;
  padding: 24px;
  background: white;
  border-radius: 12px;
  text-align: center;
  font-family: sans-serif;
}

#returnTitle {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

#returnButtons {
  display: flex;
  gap: 10px;
}

.returnBtn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

#returnYes {
  background: #111;
  color: white;
}

#returnNo {
  background: #ddd;
  color: #111;
}

/* HIT表示 */
#hitModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at center, rgba(0,70,118,0.28), rgba(0,0,0,0.72));
  z-index: 90;
}

#hitBox {
  width: min(440px, calc(100% - 32px));
  padding: 22px 24px 24px;
  background: rgba(5,30,48,0.92);
  border: 2px solid rgba(255,255,255,0.92);
  border-radius: 18px;
  color: white;
  text-align: center;
  font-family: sans-serif;
  box-shadow: 0 12px 36px rgba(0,0,0,0.45);
}

#hitTitle {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: 0.08em;
  line-height: 1;
  text-shadow: 0 3px 12px rgba(0,0,0,0.5);
}

#hitSubtitle {
  margin: 8px 0 16px;
  color: rgba(255,255,255,0.84);
  font-size: 14px;
  font-weight: bold;
}

#timingGauge {
  position: relative;
  width: min(270px, 70vw);
  aspect-ratio: 1;
  margin: 0 auto 16px;
  border: 3px solid white;
  border-radius: 50%;
  background: var(--gauge-zones);
  box-shadow:
    0 0 0 2px rgba(0,0,0,0.2),
    0 0 28px rgba(32,170,255,0.28);
}

#timingGauge::after {
  content: "";
  position: absolute;
  inset: 20%;
  border: 3px solid white;
  border-radius: 50%;
  background: white;
  z-index: 1;
}

#gaugeMarker {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  transform: rotate(0deg);
  z-index: 4;
  pointer-events: none;
}

#gaugeMarker::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -3px;
  width: 14%;
  height: 12px;
  border-radius: 999px;
  background: white;
  box-shadow:
    0 0 7px 3px white,
    0 0 16px 7px rgba(255,255,255,0.72);
  transform: translateX(-50%);
}

#hitLogo {
  position: absolute;
  inset: 26%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%;
  background: white;
  z-index: 3;
}

#hitLogoImage {
  display: block;
  width: var(--hit-logo-width, 110%);
  max-width: none;
  max-height: var(--hit-logo-max-height, 90%);
  object-fit: contain;
  object-position: center;
}

#gaugeZoneResult {
  min-height: 25px;
  margin-bottom: 5px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.08em;
}

#catchResult {
  min-height: 40px;
  margin-bottom: 12px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#fishButton,
#hitContinue {
  width: min(280px, 100%);
  padding: 12px;
  border: 2px solid white;
  border-radius: 10px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#fishButton {
  background: rgba(3,39,64,0.92);
  color: white;
}

#hitContinue {
  display: none;
  background: white;
  color: #111;
}

@media (max-width: 600px) {

  #boat {
    width: 36px;
  }

  #minimap {
    width: 130px;
  }

  #speedControls {
    right: 10px;
    top: 10px;
  }

  #energyPanel {
    right: 10px;
    top: 60px;
    width: 150px;
  }

  .speedBtn {
    padding: 8px;
    font-size: 11px;
  }

  #hitBox {
    padding: 18px 16px;
  }

  #hitTitle {
    font-size: 36px;
  }

  #timingGauge {
    width: min(230px, 64vw);
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="world">
    <img id="map" src="map.jpg" alt="Game Map">
  </div>

  <img id="boat" src="boat.png" alt="Boat">

  <div id="speedControls">
    <button id="lowSpeed" class="speedBtn">LOW</button>
    <button id="normalSpeed" class="speedBtn active">NORMAL</button>
    <button id="highSpeed" class="speedBtn">HIGH</button>
  </div>

  <div id="energyPanel">
    <div id="energyText">ENERGY 100%</div>

    <div id="energyBarOuter">
      <div id="energyBarInner"></div>
    </div>
  </div>

  <div id="controls">
    <button id="up" class="control">↑</button>
    <button id="down" class="control">↓</button>
    <button id="left" class="control">←</button>
    <button id="right" class="control">→</button>
  </div>

  <div id="minimap">
    <img id="miniMapImage" src="map.jpg" alt="Mini Map">
    <div id="miniPlayer"></div>
    <button id="closeMap">×</button>
  </div>

  <button id="showMap">MAP</button>

  <!-- 帰還確認 -->
  <div id="returnModal">
    <div id="returnBox">

      <div id="returnTitle">
        桟橋に帰還しますか？
      </div>

      <div id="returnButtons">
        <button id="returnNo" class="returnBtn">
          NO
        </button>

        <button id="returnYes" class="returnBtn">
          YES
        </button>
      </div>

    </div>
  </div>

  <!-- FISHタイミングゲージ -->
  <div id="hitModal" role="dialog" aria-modal="true" aria-labelledby="hitTitle">
    <div id="hitBox">
      <div id="hitTitle">HIT!</div>
      <div id="hitSubtitle">魚が食いついた！</div>

      <div id="timingGauge" aria-label="FISH timing gauge">
        <div id="gaugeMarker"></div>

        <!-- ゲージ判定から独立したロゴ表示領域 -->
        <div id="hitLogo" data-logo-state="normal">
          <img id="hitLogoImage" alt="GREEN BOAT">
        </div>
      </div>

      <div id="gaugeZoneResult" aria-live="polite"></div>
      <div id="catchResult" aria-live="polite"></div>

      <button id="fishButton">FISH!</button>
      <button id="hitContinue">CONTINUE</button>
    </div>
  </div>

</div>

<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const map = document.getElementById("map");
const boat = document.getElementById("boat");

const miniPlayer = document.getElementById("miniPlayer");
const minimap = document.getElementById("minimap");
const closeMap = document.getElementById("closeMap");
const showMap = document.getElementById("showMap");

const energyText = document.getElementById("energyText");
const energyBarInner = document.getElementById("energyBarInner");

const returnModal = document.getElementById("returnModal");
const returnYes = document.getElementById("returnYes");
const returnNo = document.getElementById("returnNo");

const hitModal = document.getElementById("hitModal");
const timingGauge = document.getElementById("timingGauge");
const gaugeMarker = document.getElementById("gaugeMarker");
const hitLogo = document.getElementById("hitLogo");
const hitLogoImage = document.getElementById("hitLogoImage");
const gaugeZoneResult = document.getElementById("gaugeZoneResult");
const catchResult = document.getElementById("catchResult");
const fishButton = document.getElementById("fishButton");
const hitContinue = document.getElementById("hitContinue");


/* =========================
   水面判定
========================= */

const collisionCanvas =
  document.createElement("canvas");

const collisionCtx =
  collisionCanvas.getContext(
    "2d",
    { willReadFrequently: true }
  );

let mapReady = false;


/* =========================
   桟橋・スタート位置
========================= */

const dockX = 33.3;
const dockY = 24.3;

let playerX = dockX;
let playerY = dockY;


/* 桟橋判定範囲 */
const dockReturnRadius = 0.45;

/* 出船したとみなす距離 */
const dockLeaveRadius = 0.8;

let hasLeftDock = false;

let returnPromptOpen = false;

let returnPromptBlocked = false;


/* =========================
   速度
========================= */

const speeds = {
  low: 2.4,
  normal: 4.2,
  high: 7.2
};

let speedMode = "normal";

let speed = speeds.normal;


/* =========================
   ENERGY
========================= */

let energy = 100;

const energyUse = {
  low: 0.18,
  normal: 0.48,
  high: 1.2
};


/* =========================
   操作
========================= */

const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};


/* =========================
   釣りエリア
========================= */

/*
  湖全体を格子状の釣りエリアに分割する。
  エリア別設定は fishingAreaOverrides に追加できる。
*/
const fishingGrid = {
  columns: 12,
  rows: 16
};

const defaultFishingAreaSettings = {
  hitRate: 0.12,
  fishSizeTrend: "mixed",
  largeFishRate: 0.05
};

/*
  例:
  "3:5": {
    hitRate: 0.25,
    fishSizeTrend: "large",
    largeFishRate: 0.15
  }
*/
const fishingAreaOverrides = {};

const fishingAreaCache = new Map();

let currentFishingAreaKey = null;
let hitPromptOpen = false;


/* =========================
   FISHタイミングゲージ設定
========================= */

/*
  ゲージ調整はここだけを変更する。
  goodZoneDegrees はBEST両側それぞれの幅。
*/
const fishingGaugeSettings = {
  markerSpeedDegreesPerSecond: 180,
  bestZoneDegrees: 48,
  goodZoneDegrees: 64,
  successRates: {
    best: 0.95,
    good: 0.70,
    normal: 0.25
  }
};

const fishingGaugeColors = {
  best: "#55ad3d",
  good: "#ecc51b",
  normal: "#c64a32"
};

/*
  ロゴのパス・サイズ・状態はここだけで変更する。
  将来の色違い画像は states に追加する。
*/
const hitLogoSettings = {
  initialState: "normal",
  widthPercent: 100,
  maxHeightPercent: 92,
  states: {
    normal: {
      imagePath:
        "15D5A2FD-DC90-480E-9706-04AF54AB0FCE.png"
    },
    highExpectation: {
      imagePath: null
    },
    ultraRare: {
      imagePath: null
    }
  }
};

let fishingSequenceState = "idle";
let gaugeMarkerAngle = 180;
let gaugePreviousFrameTime = null;
let gaugeAnimationFrameId = null;


/* =========================
   マップ読み込み
========================= */

function prepareMap() {

  collisionCanvas.width =
    map.naturalWidth;

  collisionCanvas.height =
    map.naturalHeight;

  collisionCtx.drawImage(
    map,
    0,
    0,
    collisionCanvas.width,
    collisionCanvas.height
  );

  mapReady = true;

  updateWorld();
}


/*
  キャッシュ済み画像でも
  必ず読み込む
*/
if (map.complete) {

  prepareMap();

} else {

  map.addEventListener(
    "load",
    prepareMap
  );
}


/* =========================
   水面判定
========================= */

function isWater(
  xPercent,
  yPercent
) {

  if (!mapReady) {
    return true;
  }

  const px =
    Math.floor(
      collisionCanvas.width *
      xPercent / 100
    );

  const py =
    Math.floor(
      collisionCanvas.height *
      yPercent / 100
    );

  if (
    px < 0 ||
    py < 0 ||
    px >= collisionCanvas.width ||
    py >= collisionCanvas.height
  ) {
    return false;
  }

  const pixel =
    collisionCtx.getImageData(
      px,
      py,
      1,
      1
    ).data;

  const r = pixel[0];
  const g = pixel[1];
  const b = pixel[2];

  return (
    b > 100 &&
    b > r * 1.25 &&
    b > g * 1.05
  );
}


/* =========================
   桟橋との距離
========================= */

function distanceFromDock() {

  const dx =
    playerX - dockX;

  const dy =
    playerY - dockY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================
   釣りエリア判定
========================= */

function getFishingAreaCoordinates(
  xPercent,
  yPercent
) {

  const column = Math.min(
    fishingGrid.columns - 1,
    Math.max(
      0,
      Math.floor(
        xPercent /
        100 *
        fishingGrid.columns
      )
    )
  );

  const row = Math.min(
    fishingGrid.rows - 1,
    Math.max(
      0,
      Math.floor(
        yPercent /
        100 *
        fishingGrid.rows
      )
    )
  );

  return {
    column,
    row,
    key: `${column}:${row}`
  };
}


function getFishingArea(
  xPercent,
  yPercent
) {

  const coordinates =
    getFishingAreaCoordinates(
      xPercent,
      yPercent
    );

  if (
    !fishingAreaCache.has(
      coordinates.key
    )
  ) {

    fishingAreaCache.set(
      coordinates.key,
      {
        id: coordinates.key,
        column: coordinates.column,
        row: coordinates.row,
        ...defaultFishingAreaSettings,
        ...(
          fishingAreaOverrides[
            coordinates.key
          ] || {}
        )
      }
    );
  }

  return fishingAreaCache.get(
    coordinates.key
  );
}


function clearMovementInput() {

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;
}


/*
  中央ロゴの表示処理。
  ゲージ判定とは独立しており、将来は画像や色演出に差し替えられる。
*/
function setHitLogoPresentation(
  state =
    hitLogoSettings.initialState
) {

  const normalLogo =
    hitLogoSettings
      .states.normal;

  const selectedLogo =
    hitLogoSettings
      .states[state];

  const imagePath =
    selectedLogo?.imagePath ||
    normalLogo.imagePath;

  hitLogo.dataset.logoState =
    state;

  hitLogo.style.setProperty(
    "--hit-logo-width",
    hitLogoSettings.widthPercent +
    "%"
  );

  hitLogo.style.setProperty(
    "--hit-logo-max-height",
    hitLogoSettings
      .maxHeightPercent +
    "%"
  );

  hitLogoImage.src = imagePath;
  hitLogoImage.alt = "GREEN BOAT";
}


function applyFishingGaugeZones() {

  const bestWidth =
    fishingGaugeSettings
      .bestZoneDegrees;

  const goodWidth =
    fishingGaugeSettings
      .goodZoneDegrees;

  const startAngle =
    -bestWidth / 2;

  const firstGoodEnd =
    bestWidth +
    goodWidth;

  const secondGoodStart =
    360 -
    goodWidth;

  timingGauge.style.setProperty(
    "--gauge-zones",
    `conic-gradient(
      from ${startAngle}deg,
      ${fishingGaugeColors.best} 0deg ${bestWidth}deg,
      ${fishingGaugeColors.good} ${bestWidth}deg ${firstGoodEnd}deg,
      ${fishingGaugeColors.normal} ${firstGoodEnd}deg ${secondGoodStart}deg,
      ${fishingGaugeColors.good} ${secondGoodStart}deg 360deg
    )`
  );
}


function updateGaugeMarker() {

  gaugeMarker.style.transform =
    `rotate(${gaugeMarkerAngle}deg)`;
}


function runGaugeAnimation(
  currentFrameTime
) {

  if (
    fishingSequenceState !==
    "gauge"
  ) {
    return;
  }

  if (
    gaugePreviousFrameTime ===
    null
  ) {
    gaugePreviousFrameTime =
      currentFrameTime;
  }

  const deltaSeconds = Math.min(
    (
      currentFrameTime -
      gaugePreviousFrameTime
    ) /
    1000,
    0.05
  );

  gaugePreviousFrameTime =
    currentFrameTime;

  gaugeMarkerAngle =
    (
      gaugeMarkerAngle +
      fishingGaugeSettings
        .markerSpeedDegreesPerSecond *
      deltaSeconds
    ) %
    360;

  updateGaugeMarker();

  gaugeAnimationFrameId =
    requestAnimationFrame(
      runGaugeAnimation
    );
}


function startFishingGauge() {

  fishingSequenceState =
    "gauge";

  gaugeMarkerAngle = 180;
  gaugePreviousFrameTime = null;

  gaugeZoneResult.textContent = "";
  gaugeZoneResult.style.color =
    "white";

  catchResult.textContent = "";

  fishButton.style.display =
    "inline-block";

  hitContinue.style.display =
    "none";

  setHitLogoPresentation();
  applyFishingGaugeZones();
  updateGaugeMarker();

  gaugeAnimationFrameId =
    requestAnimationFrame(
      runGaugeAnimation
    );
}


function getGaugeZone(
  markerAngle
) {

  const signedAngle =
    (
      (
        markerAngle +
        180
      ) %
      360
    ) -
    180;

  const distanceFromBest =
    Math.abs(signedAngle);

  const bestHalfWidth =
    fishingGaugeSettings
      .bestZoneDegrees /
    2;

  if (
    distanceFromBest <=
    bestHalfWidth
  ) {
    return "best";
  }

  if (
    distanceFromBest <=
    bestHalfWidth +
    fishingGaugeSettings
      .goodZoneDegrees
  ) {
    return "good";
  }

  return "normal";
}


function stopFishingGauge() {

  if (
    fishingSequenceState !==
    "gauge"
  ) {
    return;
  }

  fishingSequenceState =
    "result";

  if (
    gaugeAnimationFrameId !==
    null
  ) {
    cancelAnimationFrame(
      gaugeAnimationFrameId
    );
  }

  gaugeAnimationFrameId = null;

  const zone = getGaugeZone(
    gaugeMarkerAngle
  );

  const successRate =
    fishingGaugeSettings
      .successRates[zone];

  const caught =
    Math.random() <
    successRate;

  gaugeZoneResult.textContent =
    zone.toUpperCase();

  gaugeZoneResult.style.color =
    fishingGaugeColors[zone];

  catchResult.textContent =
    caught ?
      "CATCH!" :
      "MISS…";

  catchResult.style.color =
    caught ?
      "#8dd047" :
      "#d8e0e5";

  fishButton.style.display =
    "none";

  hitContinue.style.display =
    "inline-block";

  hitContinue.focus();
}


function resetFishingSequence() {

  if (
    gaugeAnimationFrameId !==
    null
  ) {
    cancelAnimationFrame(
      gaugeAnimationFrameId
    );
  }

  gaugeAnimationFrameId = null;
  gaugePreviousFrameTime = null;
  fishingSequenceState = "idle";

  gaugeZoneResult.textContent = "";
  catchResult.textContent = "";

  fishButton.style.display =
    "inline-block";

  hitContinue.style.display =
    "none";
}


function openHitPrompt() {

  if (
    hitPromptOpen ||
    returnPromptOpen
  ) {
    return;
  }

  hitPromptOpen = true;

  clearMovementInput();

  hitModal.style.display =
    "flex";

  startFishingGauge();

  fishButton.focus();
}


function checkFishingAreaEntry() {

  const area = getFishingArea(
    playerX,
    playerY
  );

  if (
    area.id ===
    currentFishingAreaKey
  ) {
    return;
  }

  currentFishingAreaKey = area.id;

  if (
    Math.random() <
    area.hitRate
  ) {
    openHitPrompt();
  }
}


fishButton.addEventListener(
  "click",
  stopFishingGauge
);


hitContinue.addEventListener(
  "click",
  () => {

    if (
      fishingSequenceState !==
      "result"
    ) {
      return;
    }

    resetFishingSequence();

    hitPromptOpen = false;

    hitModal.style.display =
      "none";
  }
);


/* =========================
   ENERGY表示
========================= */

function updateEnergy() {

  energy =
    Math.max(
      0,
      Math.min(
        100,
        energy
      )
    );

  energyText.textContent =
    "ENERGY " +
    Math.floor(energy) +
    "%";

  energyBarInner.style.width =
    energy + "%";
}


/* =========================
   マップ更新
========================= */

function updateWorld() {

  if (
    !map.offsetWidth ||
    !map.offsetHeight
  ) {
    return;
  }

  const playerPixelX =
    map.offsetWidth *
    playerX / 100;

  const playerPixelY =
    map.offsetHeight *
    playerY / 100;

  world.style.left =
    (
      game.clientWidth / 2 -
      playerPixelX
    ) + "px";

  world.style.top =
    (
      game.clientHeight / 2 -
      playerPixelY
    ) + "px";

  miniPlayer.style.left =
    playerX + "%";

  miniPlayer.style.top =
    playerY + "%";
}


/* =========================
   釣行リセット
========================= */

function resetTrip() {

  playerX = dockX;
  playerY = dockY;

  energy = 100;

  hasLeftDock = false;

  returnPromptOpen = false;

  returnPromptBlocked = false;

  hitPromptOpen = false;

  resetFishingSequence();

  currentFishingAreaKey =
    getFishingArea(
      playerX,
      playerY
    ).id;

  returnModal.style.display =
    "none";

  hitModal.style.display =
    "none";

  clearMovementInput();

  changeSpeed("normal");

  updateEnergy();
  updateWorld();
}


/* =========================
   帰還確認
========================= */

function openReturnPrompt() {

  if (
    returnPromptOpen ||
    returnPromptBlocked ||
    hitPromptOpen
  ) {
    return;
  }

  returnPromptOpen = true;

  clearMovementInput();

  returnModal.style.display =
    "flex";
}


/* YES */
returnYes.addEventListener(
  "click",
  () => {

    /*
      後でここで
      今回釣った魚を正式記録する
    */

    alert(
      "釣行終了！\n今回の釣果が確定しました。"
    );

    resetTrip();
  }
);


/* NO */
returnNo.addEventListener(
  "click",

  () => {

    returnPromptOpen = false;

    returnPromptBlocked = true;

    returnModal.style.display = "none";

    /* NOを押した瞬間から操作再開 */

    keys.up = false;

    keys.down = false;

    keys.left = false;

    keys.right = false;

  }

);


/* =========================
   ENERGY切れ
========================= */

function failTrip() {

  energy = 0;

  updateEnergy();

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;

  alert(
    "ENERGY切れ！\n\n釣行失敗。\n今回釣った魚はすべて無効です。"
  );

  /*
    後でここで
    今回釣った魚を全部削除
  */

  resetTrip();
}


/* =========================
   ゲームループ
========================= */

let previousFrameTime = null;

function gameLoop(currentFrameTime) {

  if (previousFrameTime === null) {
    previousFrameTime = currentFrameTime;
  }

  const deltaSeconds = Math.min(
    (currentFrameTime - previousFrameTime) / 1000,
    0.05
  );

  previousFrameTime = currentFrameTime;

  let dx = 0;
  let dy = 0;

  /*
    帰還確認中・HIT表示中は船を止める
  */
  if (
    !returnPromptOpen &&
    !hitPromptOpen
  ) {

    if (keys.up) {
      dy -= 1;
    }

    if (keys.down) {
      dy += 1;
    }

    if (keys.left) {
      dx -= 1;
    }

    if (keys.right) {
      dx += 1;
    }


    if (
      dx !== 0 ||
      dy !== 0
    ) {

      /*
        斜め移動でも速度を一定にする
      */
      const directionLength =
        Math.hypot(dx, dy);

      dx =
        dx /
        directionLength *
        speed *
        deltaSeconds;

      dy =
        dy /
        directionLength *
        speed *
        deltaSeconds;

      const nextX =
        playerX + dx;

      const nextY =
        playerY + dy;


      /*
        船の中心が水面なら移動
      */
      if (
        isWater(
          nextX,
          nextY
        )
      ) {

        playerX = nextX;
        playerY = nextY;


        /*
          ENERGY消費
        */
        energy -=
          energyUse[speedMode] *
          deltaSeconds;


        const dockDistance =
          distanceFromDock();


        /*
          桟橋から離れたら
          出船成立
        */
        if (
          !hasLeftDock &&
          dockDistance >
          dockLeaveRadius
        ) {

          hasLeftDock = true;
        }


        /*
          NOを押したあと
          一度桟橋から離れれば
          再び帰還確認可能
        */
        if (
          returnPromptBlocked &&
          dockDistance >
          dockLeaveRadius
        ) {

          returnPromptBlocked = false;
        }


        /*
          桟橋に戻った
        */
        if (
          hasLeftDock &&
          !returnPromptBlocked &&
          dockDistance <=
          dockReturnRadius
        ) {

          openReturnPrompt();
        }


        /*
          ENERGY切れ
        */
        if (
          energy <= 0 &&
          !returnPromptOpen
        ) {

          failTrip();

        } else if (
          !returnPromptOpen
        ) {

          /*
            新しい釣りエリアに入った時だけ
            HIT抽選を行う
          */
          checkFishingAreaEntry();
        }
      }


      /*
        船の向き
      */
      const angle =
        Math.atan2(
          dy,
          dx
        ) *
        180 /
        Math.PI +
        180;

      boat.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg)`;
    }
  }


  updateEnergy();

  updateWorld();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   PC操作
========================= */

document.addEventListener(
  "keydown",
  (e) => {

    if (hitPromptOpen) {

      if (e.code === "Space") {
        e.preventDefault();

        if (!e.repeat) {
          stopFishingGauge();
        }
      }

      return;
    }

    if (
      returnPromptOpen
    ) {
      return;
    }

    if (e.key === "ArrowUp") {
      keys.up = true;
    }

    if (e.key === "ArrowDown") {
      keys.down = true;
    }

    if (e.key === "ArrowLeft") {
      keys.left = true;
    }

    if (e.key === "ArrowRight") {
      keys.right = true;
    }

    if (
      e.key.startsWith(
        "Arrow"
      )
    ) {
      e.preventDefault();
    }
  }
);


document.addEventListener(
  "keyup",
  (e) => {

    if (e.key === "ArrowUp") {
      keys.up = false;
    }

    if (e.key === "ArrowDown") {
      keys.down = false;
    }

    if (e.key === "ArrowLeft") {
      keys.left = false;
    }

    if (e.key === "ArrowRight") {
      keys.right = false;
    }
  }
);


/*
  ウィンドウを切り替えたときに
  入力が残らないようにする
*/
window.addEventListener(
  "blur",
  () => {
    clearMovementInput();
  }
);


/* =========================
   スマホ操作
========================= */

function setupButton(
  id,
  direction
) {

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();

      if (
        returnPromptOpen ||
        hitPromptOpen
      ) {
        return;
      }

      keys[direction] = true;
    }
  );

  const stop = () => {
    keys[direction] = false;
  };

  button.addEventListener(
    "pointerup",
    stop
  );

  button.addEventListener(
    "pointerleave",
    stop
  );

  button.addEventListener(
    "pointercancel",
    stop
  );
}


setupButton("up", "up");
setupButton("down", "down");
setupButton("left", "left");
setupButton("right", "right");


/* =========================
   速度切替
========================= */

const lowButton =
  document.getElementById(
    "lowSpeed"
  );

const normalButton =
  document.getElementById(
    "normalSpeed"
  );

const highButton =
  document.getElementById(
    "highSpeed"
  );


function changeSpeed(mode) {

  speedMode = mode;

  speed =
    speeds[mode];

  document
    .querySelectorAll(
      ".speedBtn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );
      }
    );

  if (mode === "low") {
    lowButton.classList.add(
      "active"
    );
  }

  if (mode === "normal") {
    normalButton.classList.add(
      "active"
    );
  }

  if (mode === "high") {
    highButton.classList.add(
      "active"
    );
  }
}


lowButton.addEventListener(
  "click",
  () => changeSpeed("low")
);

normalButton.addEventListener(
  "click",
  () => changeSpeed("normal")
);

highButton.addEventListener(
  "click",
  () => changeSpeed("high")
);


/* =========================
   ミニマップ
========================= */

closeMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "none";

    showMap.style.display =
      "block";
  }
);


showMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "block";

    showMap.style.display =
      "none";
  }
);


window.addEventListener(
  "resize",
  updateWorld
);


updateEnergy();

currentFishingAreaKey =
  getFishingArea(
    playerX,
    playerY
  ).id;

requestAnimationFrame(
  gameLoop
);

</script>
