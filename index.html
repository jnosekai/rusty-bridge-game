<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rusty Bridge Game</title>

  <style>

    html, body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #000;

    }

    #game {

      position: relative;

      width: 100%;

      height: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #000;

    }

    #map {

      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      display: block;

    }

    #boat {

      position: absolute;

      width: 90px;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;

    }

  </style>

</head>

<body>

  <div id="game">

    <img id="map" src="map.png" alt="Game Map">

    <img id="boat" src="boat.png" alt="Boat">

  </div>

</body>

</html>
