<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty Bridge Game</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #world {
      position: relative;
      height: 100%;
      width: fit-content;
    }

    #map {
      height: 100%;
      width: auto;
      display: block;
    }

    #boat {
      position: absolute;

  left: 33%;

  top: 23.5%;

  width: 4%;

  transform: translate(-50%, -50%);

  pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="world">
      <img id="map" src="map.png" alt="Game Map">
      <img id="boat" src="boat.png" alt="Boat">
    </div>
  </div>
</body>
</html>
