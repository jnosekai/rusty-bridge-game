<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty Bridge Game</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
    }

    #world {
      position: relative;
      height: 100%;
      width: fit-content;
    }

    #map {
      height: 100%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    #boat {
      position: absolute;
      left: 33%;
      top: 24.5%;
      width: 2.75%;

      transform: translate(-50%, -50%) rotate(180deg);
      transform-origin: center;

      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #controls {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 150px;
      height: 150px;
      z-index: 10;
    }

    .control-btn {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      font-size: 24px;
      font-weight: bold;
      touch-action: none;
    }

    #up {
      left: 50px;
      top: 0;
    }

    #down {
      left: 50px;
      bottom: 0;
    }

    #left {
      left: 0;
      top: 50px;
    }

    #right {
      right: 0;
      top: 50px;
    }

    #collisionCanvas {
      display: none;
    }
  </style>
</head>

<body>

  <div id="game">

    <div id="world">
      <img id="map" src="map.png" alt="Game Map">
      <img id="boat" src="boat.png" alt="Boat">
    </div>

    <div id="controls">
      <button id="up" class="control-btn">↑</button>
      <button id="down" class="control-btn">↓</button>
      <button id="left" class="control-btn">←</button>
      <button id="right" class="control-btn">→</button>
    </div>

  </div>

  <canvas id="collisionCanvas"></canvas>

  <script>
    const map = document.getElementById('map');
    const boat = document.getElementById('boat');

    const canvas = document.getElementById('collisionCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let x = 33;
    let y = 24.5;

    const speed = 0.12;

    let mapReady = false;

    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    map.addEventListener('load', () => {
      canvas.width = map.naturalWidth;
      canvas.height = map.naturalHeight;

      ctx.drawImage(map, 0, 0);

      mapReady = true;
    });

    function isWater(percentX, percentY) {

      if (!mapReady) return true;

      const px = Math.floor(
        (percentX / 100) * canvas.width
      );

      const py = Math.floor(
        (percentY / 100) * canvas.height
      );

      if (
        px < 0 ||
        py < 0 ||
        px >= canvas.width ||
        py >= canvas.height
      ) {
        return false;
      }

      const pixel = ctx.getImageData(
        px,
        py,
        1,
        1
      ).data;

      const r = pixel[0];
      const g = pixel[1];
      const b = pixel[2];

      /*
        湖の青色を判定。
        青〜水色ならtrue。
      */

      return (
        b > 110 &&
        g > 70 &&
        b > r + 20 &&
        b > g * 0.85
      );
    }

    function updateBoat() {

      let dx = 0;
      let dy = 0;

      if (keys.up) dy -= speed;
      if (keys.down) dy += speed;
      if (keys.left) dx -= speed;
      if (keys.right) dx += speed;

      if (dx !== 0 || dy !== 0) {

        const newX = x + dx;
        const newY = y + dy;

        /*
          X方向だけ動けるか確認
        */

        if (isWater(newX, y)) {
          x = newX;
        }

        /*
          Y方向だけ動けるか確認
        */

        if (isWater(x, newY)) {
          y = newY;
        }

        /*
          船首を進行方向へ向ける
        */

        const angle =
          Math.atan2(dy, dx) * 180 / Math.PI + 180;

        boat.style.transform =
          `translate(-50%, -50%) rotate(${angle}deg)`;
      }

      boat.style.left = x + '%';
      boat.style.top = y + '%';

      requestAnimationFrame(updateBoat);
    }

    document.addEventListener('keydown', (e) => {

      if (e.key === 'ArrowUp') {
        keys.up = true;
        e.preventDefault();
      }

      if (e.key === 'ArrowDown') {
        keys.down = true;
        e.preventDefault();
      }

      if (e.key === 'ArrowLeft') {
        keys.left = true;
        e.preventDefault();
      }

      if (e.key === 'ArrowRight') {
        keys.right = true;
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', (e) => {

      if (e.key === 'ArrowUp') keys.up = false;
      if (e.key === 'ArrowDown') keys.down = false;
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });

    function setupButton(id, direction) {

      const btn = document.getElementById(id);

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        keys[direction] = true;
      });

      btn.addEventListener('pointerup', () => {
        keys[direction] = false;
      });

      btn.addEventListener('pointerleave', () => {
        keys[direction] = false;
      });

      btn.addEventListener('pointercancel', () => {
        keys[direction] = false;
      });
    }

    setupButton('up', 'up');
    setupButton('down', 'down');
    setupButton('left', 'left');
    setupButton('right', 'right');

    updateBoat();
  </script>

</body>
</html>
