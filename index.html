<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty Bridge Game</title>

  <style>
    * {
    
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ゲーム画面 */
    #game {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 大きいメインマップ */
    #world {
      position: absolute;
      left: 0;
      top: 0;
      height: 900%;
    }

    #map {
      height: 100%;
      width: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ボート */
    #boat {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 48px;

      transform: translate(-50%, -50%) rotate(180deg);
      transform-origin: center;

      z-index: 20;

      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 操作ボタン */
    #controls {
      position: absolute;
      left: 20px;
      bottom: 20px;

      width: 150px;
      height: 150px;

      z-index: 40;
    }

    .control {
      position: absolute;

      width: 50px;
      height: 50px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,0.85);

      font-size: 24px;
      font-weight: bold;

      touch-action: none;
      cursor: pointer;
    }

    #up {
      left: 50px;
      top: 0;
    }

    #down {
      left: 50px;
      bottom: 0;
    }

    #left {
      left: 0;
      top: 50px;
    }

    #right {
      right: 0;
      top: 50px;
    }

    /* 右下ミニマップ */
    #minimap {
      position: absolute;
      right: 18px;
      bottom: 18px;

      width: 180px;

      border: 2px solid white;

      z-index: 30;
    }

    #miniMapImage {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 現在地 */
    #miniPlayer {
      position: absolute;

      width: 10px;
      height: 10px;

      background: red;
      border: 2px solid white;

      border-radius: 50%;

      transform: translate(-50%, -50%);

      z-index: 31;
    }

    /* ミニマップ閉じる */
    #closeMap {
      position: absolute;
      right: 4px;
      top: 4px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,0.7);
      color: white;

      font-size: 17px;

      z-index: 32;
      cursor: pointer;
    }

    /* MAP再表示 */
    #showMap {
      position: absolute;
      right: 18px;
      bottom: 18px;

      display: none;

      padding: 10px 15px;

      border: none;
      border-radius: 8px;

      font-weight: bold;

      z-index: 40;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #boat {
        width: 36px;
      }

      #minimap {
        width: 130px;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <!-- メインマップ -->
  <div id="world">
    <img id="map" src="map.jpg" alt="Game Map">
  </div>

  <!-- ボート -->
  <img id="boat" src="boat.png" alt="Boat">

  <!-- 操作 -->
  <div id="controls">
    <button id="up" class="control">↑</button>
    <button id="down" class="control">↓</button>
    <button id="left" class="control">←</button>
    <button id="right" class="control">→</button>
  </div>

  <!-- ミニマップ -->
  <div id="minimap">
    <img id="miniMapImage" src="map.jpg" alt="Mini Map">

    <div id="miniPlayer"></div>

    <button id="closeMap">×</button>
  </div>

  <button id="showMap">MAP</button>

</div>


<script>
  const game = document.getElementById("game");

  const world = document.getElementById("world");

  const map = document.getElementById("map");

  const boat = document.getElementById("boat");

  const miniPlayer = document.getElementById("miniPlayer");

  const minimap = document.getElementById("minimap");

  const closeMap = document.getElementById("closeMap");

  const showMap = document.getElementById("showMap");

  /* 水面判定用 */

  const collisionCanvas = document.createElement("canvas");

  const collisionCtx = collisionCanvas.getContext(

    "2d",

    { willReadFrequently: true }

  );

  let mapReady = false;

  /* スタート位置 */

  let playerX = 33.3;

  let playerY = 24.3;

  /* 移動速度 */

  const speed = 0.07;

  const keys = {

    up: false,

    down: false,

    left: false,

    right: false

  };

  /* =========================

     マップ読み込み

  ========================= */

  map.addEventListener("load", () => {

    collisionCanvas.width = map.naturalWidth;

    collisionCanvas.height = map.naturalHeight;

    collisionCtx.drawImage(

      map,

      0,

      0,

      collisionCanvas.width,

      collisionCanvas.height

    );

    mapReady = true;

    updateWorld();

  });

  /* =========================

     水面判定

     船の中心点だけを見る

  ========================= */

  function isWater(xPercent, yPercent) {

    if (!mapReady) {

      return true;

    }

    const px = Math.floor(

      collisionCanvas.width *

      xPercent / 100

    );

    const py = Math.floor(

      collisionCanvas.height *

      yPercent / 100

    );

    if (

      px < 0 ||

      py < 0 ||

      px >= collisionCanvas.width ||

      py >= collisionCanvas.height

    ) {

      return false;

    }

    const pixel =

      collisionCtx.getImageData(

        px,

        py,

        1,

        1

      ).data;

    const r = pixel[0];

    const g = pixel[1];

    const b = pixel[2];

    /*

      水面の青を判定。

      森の緑や岸の茶色はfalse。

    */

    return (

      b > 100 &&

      b > r * 1.25 &&

      b > g * 1.05

    );

  }

  /* =========================

     画面更新

  ========================= */

  function updateWorld() {

    if (!map.offsetWidth || !map.offsetHeight) {

      return;

    }

    const playerPixelX =

      map.offsetWidth *

      playerX / 100;

    const playerPixelY =

      map.offsetHeight *

      playerY / 100;

    world.style.left =

      (

        game.clientWidth / 2 -

        playerPixelX

      ) + "px";

    world.style.top =

      (

        game.clientHeight / 2 -

        playerPixelY

      ) + "px";

    miniPlayer.style.left =

      playerX + "%";

    miniPlayer.style.top =

      playerY + "%";

  }

  /* =========================

     ゲームループ

  ========================= */

  function gameLoop() {

    let dx = 0;

    let dy = 0;

    if (keys.up) dy -= speed;

    if (keys.down) dy += speed;

    if (keys.left) dx -= speed;

    if (keys.right) dx += speed;

    if (dx !== 0 || dy !== 0) {

      const nextX = playerX + dx;

      const nextY = playerY + dy;

      /*

        船の中心点が水面なら移動

      */

      if (

        isWater(

          nextX,

          nextY

        )

      ) {

        playerX = nextX;

        playerY = nextY;

      }

      /*

        船の向きは入力方向に合わせる

      */

      const angle =

        Math.atan2(

          dy,

          dx

        ) *

        180 /

        Math.PI +

        180;

      boat.style.transform =

        `translate(-50%, -50%) rotate(${angle}deg)`;

    }

    updateWorld();

    requestAnimationFrame(

      gameLoop

    );

  }

  /* =========================

     PC操作

  ========================= */

  document.addEventListener(

    "keydown",

    (e) => {

      if (e.key === "ArrowUp") {

        keys.up = true;

      }

      if (e.key === "ArrowDown") {

        keys.down = true;

      }

      if (e.key === "ArrowLeft") {

        keys.left = true;

      }

      if (e.key === "ArrowRight") {

        keys.right = true;

      }

      if (

        e.key.startsWith("Arrow")

      ) {

        e.preventDefault();

      }

    }

  );

  document.addEventListener(

    "keyup",

    (e) => {

      if (e.key === "ArrowUp") {

        keys.up = false;

      }

      if (e.key === "ArrowDown") {

        keys.down = false;

      }

      if (e.key === "ArrowLeft") {

        keys.left = false;

      }

      if (e.key === "ArrowRight") {

        keys.right = false;

      }

    }

  );

  /* =========================

     スマホ操作

  ========================= */

  function setupButton(

    id,

    direction

  ) {

    const button =

      document.getElementById(id);

    button.addEventListener(

      "pointerdown",

      (e) => {

        e.preventDefault();

        keys[direction] = true;

      }

    );

    const stop = () => {

      keys[direction] = false;

    };

    button.addEventListener(

      "pointerup",

      stop

    );

    button.addEventListener(

      "pointerleave",

      stop

    );

    button.addEventListener(

      "pointercancel",

      stop

    );

  }

  setupButton("up", "up");

  setupButton("down", "down");

  setupButton("left", "left");

  setupButton("right", "right");

  /* =========================

     ミニマップ

  ========================= */

  closeMap.addEventListener(

    "click",

    () => {

      minimap.style.display =

        "none";

      showMap.style.display =

        "block";

    }

  );

  showMap.addEventListener(

    "click",

    () => {

      minimap.style.display =

        "block";

      showMap.style.display =

        "none";

    }

  );

  window.addEventListener(

    "resize",

    updateWorld

  );

  gameLoop();
</script>

</body>
</html>
