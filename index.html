<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusty Bridge Game</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#game {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

/* フィールド */
#world {
  position: absolute;
  left: 0;
  top: 0;
  height: 900%;
}

#map {
  height: 100%;
  width: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* ボート */
#boat {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  transform: translate(-50%, -50%) rotate(180deg);
  transform-origin: center;
  z-index: 20;
  pointer-events: none;
}

/* 操作 */
#controls {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 150px;
  height: 150px;
  z-index: 40;
}

.control {
  position: absolute;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  font-size: 24px;
  font-weight: bold;
  touch-action: none;
}

#up {
  left: 50px;
  top: 0;
}

#down {
  left: 50px;
  bottom: 0;
}

#left {
  left: 0;
  top: 50px;
}

#right {
  right: 0;
  top: 50px;
}

/* 速度 */
#speedControls {
  position: absolute;
  right: 20px;
  top: 20px;
  display: flex;
  gap: 6px;
  z-index: 50;
}

.speedBtn {
  padding: 9px 11px;
  border: 2px solid white;
  border-radius: 7px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.speedBtn.active {
  background: white;
  color: black;
}

/* ENERGY */
#energyPanel {
  position: absolute;
  top: 70px;
  right: 20px;
  width: 180px;
  padding: 10px;
  background: rgba(0,0,0,0.65);
  border: 2px solid white;
  border-radius: 8px;
  color: white;
  font-family: sans-serif;
  z-index: 50;
}

#energyText {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

#energyBarOuter {
  width: 100%;
  height: 14px;
  border: 1px solid white;
  background: rgba(255,255,255,0.15);
  overflow: hidden;
}

#energyBarInner {
  width: 100%;
  height: 100%;
  background: white;
}

/* ミニマップ */
#minimap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 180px;
  border: 2px solid white;
  z-index: 30;
}

#miniMapImage {
  width: 100%;
  height: auto;
  display: block;
}

#miniPlayer {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#closeMap {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
}

#showMap {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: none;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  z-index: 40;
}

/* 帰還確認画面 */
#returnModal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  z-index: 100;
}

#returnBox {
  width: 280px;
  padding: 24px;
  background: white;
  border-radius: 12px;
  text-align: center;
  font-family: sans-serif;
}

#returnTitle {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

#returnButtons {
  display: flex;
  gap: 10px;
}

.returnBtn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

#returnYes {
  background: #111;
  color: white;
}

#returnNo {
  background: #ddd;
  color: #111;
}

@media (max-width: 600px) {

  #boat {
    width: 36px;
  }

  #minimap {
    width: 130px;
  }

  #speedControls {
    right: 10px;
    top: 10px;
  }

  #energyPanel {
    right: 10px;
    top: 60px;
    width: 150px;
  }

  .speedBtn {
    padding: 8px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="world">
    <img id="map" src="map.jpg" alt="Game Map">
  </div>

  <img id="boat" src="boat.png" alt="Boat">

  <div id="speedControls">
    <button id="lowSpeed" class="speedBtn">LOW</button>
    <button id="normalSpeed" class="speedBtn active">NORMAL</button>
    <button id="highSpeed" class="speedBtn">HIGH</button>
  </div>

  <div id="energyPanel">
    <div id="energyText">ENERGY 100%</div>

    <div id="energyBarOuter">
      <div id="energyBarInner"></div>
    </div>
  </div>

  <div id="controls">
    <button id="up" class="control">↑</button>
    <button id="down" class="control">↓</button>
    <button id="left" class="control">←</button>
    <button id="right" class="control">→</button>
  </div>

  <div id="minimap">
    <img id="miniMapImage" src="map.jpg" alt="Mini Map">
    <div id="miniPlayer"></div>
    <button id="closeMap">×</button>
  </div>

  <button id="showMap">MAP</button>

  <!-- 帰還確認 -->
  <div id="returnModal">
    <div id="returnBox">

      <div id="returnTitle">
        桟橋に帰還しますか？
      </div>

      <div id="returnButtons">
        <button id="returnNo" class="returnBtn">
          NO
        </button>

        <button id="returnYes" class="returnBtn">
          YES
        </button>
      </div>

    </div>
  </div>

</div>

<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const map = document.getElementById("map");
const boat = document.getElementById("boat");

const miniPlayer = document.getElementById("miniPlayer");
const minimap = document.getElementById("minimap");
const closeMap = document.getElementById("closeMap");
const showMap = document.getElementById("showMap");

const energyText = document.getElementById("energyText");
const energyBarInner = document.getElementById("energyBarInner");

const returnModal = document.getElementById("returnModal");
const returnYes = document.getElementById("returnYes");
const returnNo = document.getElementById("returnNo");


/* =========================
   水面判定
========================= */

const collisionCanvas =
  document.createElement("canvas");

const collisionCtx =
  collisionCanvas.getContext(
    "2d",
    { willReadFrequently: true }
  );

let mapReady = false;


/* =========================
   桟橋・スタート位置
========================= */

const dockX = 33.3;
const dockY = 24.3;

let playerX = dockX;
let playerY = dockY;


/* 桟橋判定範囲 */
const dockReturnRadius = 0.45;

/* 出船したとみなす距離 */
const dockLeaveRadius = 0.8;

let hasLeftDock = false;

let returnPromptOpen = false;

let returnPromptBlocked = false;


/* =========================
   速度
========================= */

const speeds = {
  low: 0.04,
  normal: 0.07,
  high: 0.12
};

let speedMode = "normal";

let speed = speeds.normal;


/* =========================
   ENERGY
========================= */

let energy = 100;

const energyUse = {
  low: 0.003,
  normal: 0.008,
  high: 0.02
};


/* =========================
   操作
========================= */

const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};


/* =========================
   マップ読み込み
========================= */

function prepareMap() {

  collisionCanvas.width =
    map.naturalWidth;

  collisionCanvas.height =
    map.naturalHeight;

  collisionCtx.drawImage(
    map,
    0,
    0,
    collisionCanvas.width,
    collisionCanvas.height
  );

  mapReady = true;

  updateWorld();
}


/*
  キャッシュ済み画像でも
  必ず読み込む
*/
if (map.complete) {

  prepareMap();

} else {

  map.addEventListener(
    "load",
    prepareMap
  );
}


/* =========================
   水面判定
========================= */

function isWater(
  xPercent,
  yPercent
) {

  if (!mapReady) {
    return true;
  }

  const px =
    Math.floor(
      collisionCanvas.width *
      xPercent / 100
    );

  const py =
    Math.floor(
      collisionCanvas.height *
      yPercent / 100
    );

  if (
    px < 0 ||
    py < 0 ||
    px >= collisionCanvas.width ||
    py >= collisionCanvas.height
  ) {
    return false;
  }

  const pixel =
    collisionCtx.getImageData(
      px,
      py,
      1,
      1
    ).data;

  const r = pixel[0];
  const g = pixel[1];
  const b = pixel[2];

  return (
    b > 100 &&
    b > r * 1.25 &&
    b > g * 1.05
  );
}


/* =========================
   桟橋との距離
========================= */

function distanceFromDock() {

  const dx =
    playerX - dockX;

  const dy =
    playerY - dockY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================
   ENERGY表示
========================= */

function updateEnergy() {

  energy =
    Math.max(
      0,
      Math.min(
        100,
        energy
      )
    );

  energyText.textContent =
    "ENERGY " +
    Math.floor(energy) +
    "%";

  energyBarInner.style.width =
    energy + "%";
}


/* =========================
   マップ更新
========================= */

function updateWorld() {

  if (
    !map.offsetWidth ||
    !map.offsetHeight
  ) {
    return;
  }

  const playerPixelX =
    map.offsetWidth *
    playerX / 100;

  const playerPixelY =
    map.offsetHeight *
    playerY / 100;

  world.style.left =
    (
      game.clientWidth / 2 -
      playerPixelX
    ) + "px";

  world.style.top =
    (
      game.clientHeight / 2 -
      playerPixelY
    ) + "px";

  miniPlayer.style.left =
    playerX + "%";

  miniPlayer.style.top =
    playerY + "%";
}


/* =========================
   釣行リセット
========================= */

function resetTrip() {

  playerX = dockX;
  playerY = dockY;

  energy = 100;

  hasLeftDock = false;

  returnPromptOpen = false;

  returnPromptBlocked = false;

  returnModal.style.display =
    "none";

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;

  changeSpeed("normal");

  updateEnergy();
  updateWorld();
}


/* =========================
   帰還確認
========================= */

function openReturnPrompt() {

  if (
    returnPromptOpen ||
    returnPromptBlocked
  ) {
    return;
  }

  returnPromptOpen = true;

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;

  returnModal.style.display =
    "flex";
}


/* YES */
returnYes.addEventListener(
  "click",
  () => {

    /*
      後でここで
      今回釣った魚を正式記録する
    */

    alert(
      "釣行終了！\n今回の釣果が確定しました。"
    );

    resetTrip();
  }
);


/* NO */
returnNo.addEventListener(
  "click",

  () => {

    returnPromptOpen = false;

    returnPromptBlocked = true;

    returnModal.style.display = "none";

    /* NOを押した瞬間から操作再開 */

    keys.up = false;

    keys.down = false;

    keys.left = false;

    keys.right = false;

  }

);


/* =========================
   ENERGY切れ
========================= */

function failTrip() {

  energy = 0;

  updateEnergy();

  keys.up = false;
  keys.down = false;
  keys.left = false;
  keys.right = false;

  alert(
    "ENERGY切れ！\n\n釣行失敗。\n今回釣った魚はすべて無効です。"
  );

  /*
    後でここで
    今回釣った魚を全部削除
  */

  resetTrip();
}


/* =========================
   ゲームループ
========================= */

function gameLoop() {

  let dx = 0;
  let dy = 0;

  /*
    帰還確認中は船を止める
  */
  if (!returnPromptOpen) {

    if (keys.up) {
      dy -= speed;
    }

    if (keys.down) {
      dy += speed;
    }

    if (keys.left) {
      dx -= speed;
    }

    if (keys.right) {
      dx += speed;
    }


    if (
      dx !== 0 ||
      dy !== 0
    ) {

      const nextX =
        playerX + dx;

      const nextY =
        playerY + dy;


      /*
        船の中心が水面なら移動
      */
      if (
        isWater(
          nextX,
          nextY
        )
      ) {

        playerX = nextX;
        playerY = nextY;


        /*
          ENERGY消費
        */
        energy -=
          energyUse[speedMode];


        const dockDistance =
          distanceFromDock();


        /*
          桟橋から離れたら
          出船成立
        */
        if (
          !hasLeftDock &&
          dockDistance >
          dockLeaveRadius
        ) {

          hasLeftDock = true;
        }


        /*
          NOを押したあと
          一度桟橋から離れれば
          再び帰還確認可能
        */
        if (
          returnPromptBlocked &&
          dockDistance >
          dockLeaveRadius
        ) {

          returnPromptBlocked = false;
        }


        /*
          桟橋に戻った
        */
        if (
          hasLeftDock &&
          !returnPromptBlocked &&
          dockDistance <=
          dockReturnRadius
        ) {

          openReturnPrompt();
        }


        /*
          ENERGY切れ
        */
        if (
          energy <= 0 &&
          !returnPromptOpen
        ) {

          failTrip();
        }
      }


      /*
        船の向き
      */
      const angle =
        Math.atan2(
          dy,
          dx
        ) *
        180 /
        Math.PI +
        180;

      boat.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg)`;
    }
  }


  updateEnergy();

  updateWorld();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   PC操作
========================= */

document.addEventListener(
  "keydown",
  (e) => {

    if (returnPromptOpen) {
      return;
    }

    if (e.key === "ArrowUp") {
      keys.up = true;
    }

    if (e.key === "ArrowDown") {
      keys.down = true;
    }

    if (e.key === "ArrowLeft") {
      keys.left = true;
    }

    if (e.key === "ArrowRight") {
      keys.right = true;
    }

    if (
      e.key.startsWith(
        "Arrow"
      )
    ) {
      e.preventDefault();
    }
  }
);


document.addEventListener(
  "keyup",
  (e) => {

    if (e.key === "ArrowUp") {
      keys.up = false;
    }

    if (e.key === "ArrowDown") {
      keys.down = false;
    }

    if (e.key === "ArrowLeft") {
      keys.left = false;
    }

    if (e.key === "ArrowRight") {
      keys.right = false;
    }
  }
);


/* =========================
   スマホ操作
========================= */

function setupButton(
  id,
  direction
) {

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();

      if (returnPromptOpen) {
        return;
      }

      keys[direction] = true;
    }
  );

  const stop = () => {
    keys[direction] = false;
  };

  button.addEventListener(
    "pointerup",
    stop
  );

  button.addEventListener(
    "pointerleave",
    stop
  );

  button.addEventListener(
    "pointercancel",
    stop
  );
}


setupButton("up", "up");
setupButton("down", "down");
setupButton("left", "left");
setupButton("right", "right");


/* =========================
   速度切替
========================= */

const lowButton =
  document.getElementById(
    "lowSpeed"
  );

const normalButton =
  document.getElementById(
    "normalSpeed"
  );

const highButton =
  document.getElementById(
    "highSpeed"
  );


function changeSpeed(mode) {

  speedMode = mode;

  speed =
    speeds[mode];

  document
    .querySelectorAll(
      ".speedBtn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );
      }
    );

  if (mode === "low") {
    lowButton.classList.add(
      "active"
    );
  }

  if (mode === "normal") {
    normalButton.classList.add(
      "active"
    );
  }

  if (mode === "high") {
    highButton.classList.add(
      "active"
    );
  }
}


lowButton.addEventListener(
  "click",
  () => changeSpeed("low")
);

normalButton.addEventListener(
  "click",
  () => changeSpeed("normal")
);

highButton.addEventListener(
  "click",
  () => changeSpeed("high")
);


/* =========================
   ミニマップ
========================= */

closeMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "none";

    showMap.style.display =
      "block";
  }
);


showMap.addEventListener(
  "click",
  () => {

    minimap.style.display =
      "block";

    showMap.style.display =
      "none";
  }
);


window.addEventListener(
  "resize",
  updateWorld
);


updateEnergy();

gameLoop();

</script>

</body>
</html>
